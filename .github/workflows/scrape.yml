name: Daily bid scrape

# Once a day, plus a manual run from the Actions tab. Nothing else triggers it.
on:
  schedule:
    # 11:00 UTC is 7:00am Eastern Daylight Time and 6:00am Eastern Standard Time.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: bid-watch-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape public bid pages
        run: python -m scraper.scrape

      - name: Commit data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bids.json data/status.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update bid data"
            git push
          fi

      - name: Open a GitHub issue when there are new bids
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scraper.notify
